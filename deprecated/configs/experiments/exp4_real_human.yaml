# Experiment 4: Real Data with Human-Annotated Flags
# Goal: Train on high-quality human-curated flags (gold standard for real data)

experiment:
  name: "exp4_real_human"
  description: "Training on real data with expert human-annotated RFI flags"
  output_dir: "./output/exp4_real_human"
  save_every_n_epochs: 5

data:
  train_dataset: "./datasets/real_train/human_masks.npz"  # Human-annotated MS
  val_dataset: "./datasets/real_val/human_masks.npz"

model:
  checkpoint: "large"
  freeze_encoders: true
  # pretrained_weights: "./output/exp1_synthetic/model_best.pth"  # Optional: transfer learning

training:
  num_epochs: 20
  batch_size: 4
  learning_rate: 1.0e-5
  weight_decay: 0.0
  device: "cuda"

notes: |
  This experiment represents the "gold standard" for real data:
  1. Human expert labels (high quality, but expensive)
  2. Best possible real-world performance ceiling
  3. Comparison baseline for automated methods

  Challenges:
  - Limited data (human annotation is slow)
  - Inter-annotator variability
  - Expensive to scale

  Expected outcome:
  - Lower loss than exp3 (better labels)
  - Better generalization than threshold flags
  - May still not match synthetic (domain gap)
  - This is the target for production models

  Use cases:
  - Benchmark for evaluating exp2/exp3 generalization
  - Small-scale fine-tuning for critical observations
  - Validation that method works on real data
