[tool:pytest]
# Pytest configuration for SAM-RFI

# Test discovery
testpaths = tests
norecursedirs = testing samrfi legacy
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output options
addopts =
    -v
    --tb=short
    --strict-markers
    --disable-warnings

# Markers
markers =
    slow: marks tests as slow (deselect with -m "not slow")
    gpu: marks tests as requiring GPU
    integration: marks tests as integration tests

# Minimum version
minversion = 6.0

# Log configuration
log_cli = false
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Timeout for long-running tests
timeout = 300

[pytest]
pythonpath = src
    legacy
    .
