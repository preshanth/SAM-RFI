# H100 SAM3 Training Config

experiment:
  name: "sam3_h100"
  description: "SAM3 training on H100"
  output_dir: "./output/sam3_h100"
  save_every_n_epochs: 2

data:
  # Generation configs (will generate batched datasets)
  train_generation_config: configs/synthetic_train_4k.yaml
  train_dataset: ./datasets/train_4000/exact_masks
  val_generation_config: configs/synthetic_val_1k.yaml
  val_dataset: ./datasets/val_1000/exact_masks

model:
  freeze_encoders: true

training:
  num_epochs: 20
  batch_size: 16
  learning_rate: 5.0e-6
  weight_decay: 0.01
  device: "cuda"
