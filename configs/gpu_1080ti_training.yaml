# GTX 1080 Ti Training Config
# GPU: 11GB VRAM | System RAM: Assume 64GB | CPU: Assume 8 cores
#
# Memory calculations (per batch file: 1.36GB for 100 samples):
# - Data cache: 40GB for training data
# - ~29 batches cached (18% of typical 10k dataset)

data:
  train_generation_config: configs/synthetic_train_4k.yaml
  train_dataset: ./datasets/train_10000
  val_generation_config: configs/synthetic_val_1k.yaml
  val_dataset: ./datasets/val_1000
  mask_type: exact_masks

training:
  device: cuda
  num_epochs: 10
  batch_size: 4           # Small batch for 11GB VRAM
  learning_rate: 5.0e-6   # Lower LR for small batch
  model_checkpoint: tiny  # Use tiny model for 1080 Ti
  output_dir: ./training_output

  # Optimizer settings
  optimizer: adamw
  weight_decay: 0.01
  adam_betas: [0.9, 0.999]
  adam_eps: 1.0e-8

  # Loss function
  loss_function: dicece
  loss_sigmoid: true
  loss_squared_pred: true
  loss_reduction: mean

  # Model architecture
  multimask_output: false
  freeze_vision_encoder: true
  freeze_prompt_encoder: true

  # Data augmentation
  bbox_perturbation: 20

  # DataLoader settings - Conservative for 1080 Ti
  num_workers: 4
  data_cache_ram_gb: 40    # 40GB for training data cache
  val_data_cache_ram_gb: 10  # 10GB for validation
  prefetch_factor: 2
  persistent_workers: true
  pin_memory: true

  # Training optimization
  log_interval: 100
  cuda_cache_clear_interval: 50

  # Output
  plot: true
  save_model: true
