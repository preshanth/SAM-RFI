# V100 Training Configuration  
# Optimized for 32GB memory, flexible time

model:
  version: "sam2"
  variant: "large"  # Use large variant for V100-32GB
  local_model_path: "/home/nemo/Software/SAM-RFI/models/sam2-large"  # Path to downloaded model
  image_size: 1024

training:
  batch_size: 1           # Reduced for 4x tiling memory usage
  gradient_accumulation: 16 # Increased to maintain effective batch size
  mixed_precision: false   # Disable mixed precision to avoid scaler issues
  max_epochs: 200         # V100 can run for days
  learning_rate: 1e-5     # Reduced 10× for frozen encoder fine-tuning (was 1e-4)
  weight_decay: 0         # Disable for mask decoder training (was 1e-2)
  warmup_steps: 100
  
  # Memory optimization settings
  gradient_checkpointing: true
  dataloader_num_workers: 2
  pin_memory: true
  
  # Channel swapping for data augmentation
  channel_swap_seed: 42  # Set to null for random

dataset:
  loading_strategy: "eager"  # "eager", "lazy", or "hybrid"
  cache_observations: 2      # For hybrid: cache N recent observations  
  memory_budget_gb: 64       # Auto-switch to lazy if dataset exceeds this
  
hardware:
  target_gpu: "V100"
  memory_limit: "32GB"
  time_limit: "flexible"
  
optimizer:
  name: "AdamW"
  betas: [0.9, 0.999]
  eps: 1e-8

scheduler:
  name: "cosine"
  warmup_ratio: 0.1

loss:
  gaussianity:
    enabled: true  # Set to false to disable gaussianity loss for A/B testing
    weight: 0.01  # REDUCED: Overall gaussianity loss weight (was 0.1)
    complex_data_mode: "separate"  # Test real/imaginary parts separately
    measures:
      skewness:
        enabled: true
        weight: 0.3  # REDUCED: Individual component weight (was 1.0)
        target: 0.0  # Gaussian skewness target
      kurtosis:
        enabled: true
        weight: 0.3  # REDUCED: Individual component weight (was 1.0)
        target: 3.0  # Gaussian kurtosis target (excess = 0)
      anderson_darling:
        enabled: true
        weight: 0.4  # REDUCED: Individual component weight (was 2.0)

logging:
  log_every_n_steps: 50
  save_every_n_epochs: 10
  validate_every_n_epochs: 5
  
  # LossTracker configuration
  collect_metrics: true          # Silent loss data collection
  verbose_breakdown: false       # Disable detailed per-step logging
  export_on_completion: true     # Generate plots when training completes
  
validation:
  batch_size: 1
  patch_size: 512
  max_patches: 100