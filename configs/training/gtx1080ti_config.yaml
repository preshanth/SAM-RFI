# GTX 1080Ti Training Configuration
# Optimized for 11GB VRAM consumer GPU with memory constraints

model:
  version: "sam2"
  variant: "base_plus"  # Smaller variant for consumer GPU
  image_size: 1024
  checkpoint_path: null  # Will be set at runtime

training:
  batch_size: 1              # Small batch for 11GB VRAM
  gradient_accumulation: 8   # Accumulate to effective batch size of 8
  mixed_precision: false     # Disable for now to avoid scaler issues
  max_epochs: 10            # Few epochs for quick testing
  learning_rate: 1e-4       # Conservative learning rate
  weight_decay: 1e-3
  warmup_steps: 100         # Short warmup
  
  # Memory optimization settings
  gradient_checkpointing: true   # Save memory at cost of speed
  dataloader_num_workers: 2      # Limit workers to save RAM
  pin_memory: false              # Don't pin memory on consumer GPU
  compile_model: false           # Skip compilation for compatibility
  
  # Patch settings for memory efficiency
  patch_size: 512               # Smaller patches for memory
  patch_overlap: 64
  max_patches_per_epoch: 500    # Limit patches per epoch
  
hardware:
  target_gpu: "GTX1080Ti"
  memory_limit: "11GB"
  time_limit: "flexible"      # Consumer GPU can run longer
  
optimizer:
  name: "AdamW"
  betas: [0.9, 0.999]
  eps: 1e-8

scheduler:
  name: "cosine"
  warmup_ratio: 0.1

logging:
  log_every_n_steps: 10
  save_every_n_epochs: 2
  validate_every_n_epochs: 1
  
validation:
  batch_size: 1
  patch_size: 512
  max_patches: 100  # Limit validation patches