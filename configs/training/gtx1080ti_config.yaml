# GTX 1080 Ti Training Configuration
# Optimized for 11GB memory, older GPU architecture

model:
  version: "sam2"
  variant: "tiny"  # Use smallest variant for older GPU
  image_size: 512  # Smaller images to save memory

training:
  batch_size: 1           # Single batch for safety
  gradient_accumulation: 4 # Smaller accumulation
  mixed_precision: true    # FP16 crucial for memory savings
  max_epochs: 5           # Just for testing
  learning_rate: 1e-4
  weight_decay: 1e-2
  warmup_steps: 10        # Short warmup for testing
  
  # Memory optimization settings
  gradient_checkpointing: true  # Essential for 1080 Ti
  dataloader_num_workers: 1     # Fewer workers
  pin_memory: false             # May cause issues on older GPUs
  
hardware:
  target_gpu: "GTX1080Ti"
  memory_limit: "11GB"
  time_limit: "flexible"
  
optimizer:
  name: "AdamW"
  betas: [0.9, 0.999]
  eps: 1e-8

scheduler:
  name: "cosine"
  warmup_ratio: 0.1

logging:
  log_every_n_steps: 1    # Log every step for testing
  save_every_n_epochs: 2
  validate_every_n_epochs: 1