# H200 Training Config
# GPU: 141GB VRAM | System RAM: Assume 512GB | CPU: Assume 48 cores
#
# Memory calculations (per batch file: 1.36GB for 100 samples):
# - Data cache: 380GB for training data (75% of 512GB RAM)
# - ~279 batches cached (can fit full train_4000 + train_10000 partially, or ~70% of train_10000)

data:
  train_generation_config: configs/synthetic_train_4k.yaml
  train_dataset: ./datasets/train_10000
  val_generation_config: configs/synthetic_val_1k.yaml
  val_dataset: ./datasets/val_1000
  mask_type: exact_masks

training:
  device: cuda
  num_epochs: 10
  batch_size: 48          # Massive batch for 141GB VRAM
  learning_rate: 2.0e-5
  model_checkpoint: large
  output_dir: ./training_output

  # Optimizer settings
  optimizer: adamw
  weight_decay: 0.01
  adam_betas: [0.9, 0.999]
  adam_eps: 1.0e-8

  # Loss function
  loss_function: dicece
  loss_sigmoid: true
  loss_squared_pred: true
  loss_reduction: mean

  # Model architecture
  multimask_output: false
  freeze_vision_encoder: true
  freeze_prompt_encoder: true

  # Data augmentation
  bbox_perturbation: 20

  # DataLoader settings - Optimized for H200 monster GPU
  num_workers: 24
  data_cache_ram_gb: 380   # 380GB for training data cache (75% of 512GB RAM)
  val_data_cache_ram_gb: 50  # 50GB for validation
  prefetch_factor: 4
  persistent_workers: true
  pin_memory: true

  # Training optimization
  log_interval: 50
  cuda_cache_clear_interval: 50

  # Output
  plot: true
  save_model: true
