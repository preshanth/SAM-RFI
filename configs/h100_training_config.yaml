# H100 Optimized Training Config
# H100: 80GB VRAM, 230GB RAM, 20 CPU cores

data:
  # Training dataset
  train_generation_config: configs/synthetic_train_4k.yaml
  train_dataset: ./datasets/train_4000

  # Validation dataset
  val_generation_config: configs/synthetic_val_1k.yaml
  val_dataset: ./datasets/val_1000

  # Which masks to use
  mask_type: exact_masks  # or mad_masks

training:
  device: cuda
  num_epochs: 10
  batch_size: 64          # 4x increase from 16 (H100 has 80GB VRAM)
  learning_rate: 2.0e-5   # Slightly higher LR for larger batch size
  model_checkpoint: large  # tiny, small, base_plus, or large
  output_dir: ./training_output

  # Optimizer settings
  optimizer: adamw         # AdamW generally better for fine-tuning
  weight_decay: 0.01       # Small weight decay for regularization
  adam_betas: [0.9, 0.999]
  adam_eps: 1.0e-8
  momentum: 0.9           # For SGD

  # Loss function settings
  loss_function: dicece   # dicece, dice, ce, focal
  loss_sigmoid: true
  loss_squared_pred: true
  loss_reduction: mean    # mean, sum

  # Model architecture settings
  multimask_output: false  # SAM can output 1 mask (false) or 3 masks (true)
  freeze_vision_encoder: true   # Can try false if you have compute budget
  freeze_prompt_encoder: true

  # Data augmentation
  bbox_perturbation: 20   # Random bbox expansion in pixels (0 = no perturbation)

  # DataLoader performance settings - OPTIMIZED FOR H100
  num_workers: 16          # 16 of 20 cores (leave some for system)
  cache_size: 12           # 3x increase - utilize 230GB RAM
  prefetch_factor: 4       # 2x increase for better pipeline
  persistent_workers: true # Keep workers alive between epochs
  pin_memory: true         # Pin memory for faster GPU transfer

  # Training optimization
  log_interval: 50         # Log more frequently with larger batches
  cuda_cache_clear_interval: 50  # Clear more frequently with larger batches

  # Output settings
  plot: true              # Save loss curve plots
  save_model: true        # Save model checkpoints
