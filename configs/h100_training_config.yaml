# H100 Training Config
# GPU: 80GB VRAM | System RAM: 230GB | CPU: 20 cores
#
# Memory allocation strategy (50% of RAM = 115 GB):
# - Validation: ALL data (~14 GB for 1000 samples → 4000 patches after 4x augmentation)
# - Training: Remaining ~101 GB (~185 batches, 46% of train_10000)
# - Per batch file: ~1.36 GB for 100 patches

data:
  train_generation_config: configs/synthetic_train_10k.yaml
  train_dataset: ./datasets/train_10000
  val_generation_config: configs/synthetic_val_1k.yaml
  val_dataset: ./datasets/val_1000
  mask_type: exact_masks

training:
  device: cuda
  num_epochs: 10
  batch_size: 16          # Conservative for stability (can increase to 32)
  learning_rate: 1.0e-5
  model_checkpoint: large
  output_dir: ./training_output

  # Optimizer settings
  optimizer: adamw
  weight_decay: 0.01
  adam_betas: [0.9, 0.999]
  adam_eps: 1.0e-8

  # Loss function
  loss_function: dicece
  loss_sigmoid: true
  loss_squared_pred: true
  loss_reduction: mean

  # Model architecture
  multimask_output: false
  freeze_vision_encoder: true
  freeze_prompt_encoder: true

  # Data augmentation
  bbox_perturbation: 20

  # DataLoader settings - Conservative 50% RAM usage
  num_workers: 12
  data_cache_ram_gb: 101   # Training data cache (50% RAM - validation)
  val_data_cache_ram_gb: null  # Load ALL validation data (auto-calculated)
  prefetch_factor: 2
  persistent_workers: true
  pin_memory: true

  # Training optimization
  log_interval: 50
  cuda_cache_clear_interval: 50

  # Output
  plot: true
  save_model: true
