# Experiment 3: Real Data with Threshold Flags
# Goal: Train on real observations using automated (MAD/threshold) flagging

experiment:
  name: "exp3_real_threshold"
  description: "Training on real data with automated threshold-based flags (MAD, SumThreshold, etc.)"
  output_dir: "./output/exp3_real_threshold"
  save_every_n_epochs: 5

data:
  train_dataset: "./datasets/real_train/threshold_masks.npz"  # Real MS with MAD flags
  val_dataset: "./datasets/real_val/threshold_masks.npz"

model:
  checkpoint: "large"
  freeze_encoders: true
  # pretrained_weights: "./output/exp1_synthetic/model_best.pth"  # Optional: warm start from synthetic

training:
  num_epochs: 20
  batch_size: 4
  learning_rate: 1.0e-5
  weight_decay: 0.0
  device: "cuda"

notes: |
  This experiment tests learning from imperfect labels:
  1. Can SAM2 learn from noisy automated flags?
  2. Does it improve upon threshold-based flagging?
  3. Comparison with human flags (exp4)

  Challenges:
  - Threshold flags may be conservative (miss weak RFI)
  - Or aggressive (false positives on bright sources)
  - Labels are not ground truth

  Expected outcome:
  - Higher loss than synthetic (noisy labels)
  - Model may learn to refine threshold flags
  - Performance depends on threshold flag quality
