# A100 40GB GPU Configuration
# Optimized for large batch training with profiling

model:
  checkpoint: large              # Use large model for A100
  freeze_encoders: true

training:
  num_epochs: 3
  batch_size: 16                 # Start with 16, validation script will find optimal
  learning_rate: 1.0e-5
  weight_decay: 0.0
  device: cuda

dataset:
  stretch: SQRT
  flag_sigma: 5
  patch_size: 128
  apply_stretching: true

output:
  dir_path: ./validation_output
  save_plots: true