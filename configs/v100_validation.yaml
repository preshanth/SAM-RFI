# V100 32GB GPU Configuration
# Optimized for validation with profiling

model:
  checkpoint: large              # Use large model for V100
  freeze_encoders: true

training:
  num_epochs: 3
  batch_size: 8                  # Conservative start for V100, validation script will find optimal
  learning_rate: 1.0e-5
  weight_decay: 0.0
  device: cuda

dataset:
  stretch: SQRT
  flag_sigma: 5
  patch_size: 128
  apply_stretching: true

profiling:
  enabled: true                  # Master switch - disable profiling entirely
  activities:
    cpu: true                    # Profile CPU operations
    cuda: true                   # Profile CUDA operations
  record_shapes: false           # Record tensor shapes (memory cost)
  profile_memory: false          # Track memory allocations (HIGH memory cost)
  with_stack: false              # Collect stack traces (VERY HIGH memory cost)
  save_trace: false              # Save chrome trace file for visualization

output:
  dir_path: ./validation_output
  save_plots: true
