[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "samrfi"
version = "1.0.0"
description = "SAM-based Radio Frequency Interference Detection for Radio Astronomy"
authors = [
    {name = "Derod Deal", email = "dealderod@gmail.com"},
    {name = "Preshanth Jagannathan", email = "pjaganna@nrao.edu"}
]
license = {text = "MIT"}
readme = "README.md"
keywords = ["radio astronomy", "RFI", "segmentation", "SAM", "deep learning"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Astronomy",
]
requires-python = ">=3.9"

dependencies = [
    # Core scientific computing
    "numpy>=1.21.0",
    "scipy>=1.7.0",
    "pandas>=1.3.0",
    
    # Astronomy data handling
    "astropy>=5.0.0",
    
    # Deep learning (SAM2 focused)
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "transformers>=4.30.0",
    
    # Data handling & visualization
    "matplotlib>=3.5.0",
    "Pillow>=9.0.0",
    "scikit-image>=0.19.0",
    "tqdm>=4.64.0",
    
    # Dataset management
    "datasets>=2.10.0",
    "huggingface-hub>=0.15.0",
    
    # Configuration
    "pyyaml>=6.0",
    
    # System utilities
    "psutil>=5.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=22.0.0",
    "isort>=5.10.0",
    "flake8>=4.0.0",
    "mypy>=0.950",
    "pre-commit>=2.20.0",
]

training = [
    "tensorboard>=2.10.0",
    "wandb>=0.13.0",
    "monai>=1.0.0",
    "patchify>=0.2.3",
]

notebooks = [
    "jupyter>=1.0.0",
    "ipykernel>=6.15.0",
    "ipywidgets>=7.7.0",
]

# Optional CASA tools (for measurement set creation and advanced flagging comparisons)
casa = [
    "casatools",
    "casatasks",
    # Note: CASA tools may require conda installation:
    # conda install -c conda-forge casatools casatasks
]

# Note: SAM2 requires manual installation from GitHub:
# pip install git+https://github.com/facebookresearch/sam2.git
sam2 = [
    # SAM2 should be installed from GitHub:
    # pip install git+https://github.com/facebookresearch/sam2.git
]

[project.urls]
"Homepage" = "https://github.com/preshanth/SAM-RFI"
"Bug Tracker" = "https://github.com/preshanth/SAM-RFI/issues"
"Documentation" = "https://sam-rfi.readthedocs.io"
"Repository" = "https://github.com/preshanth/SAM-RFI"

[project.scripts]
samrfi = "samrfi.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 88
target-version = ["py39"]

[tool.isort]
profile = "black"
line_length = 88

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --cov=samrfi --cov-report=html --cov-report=term-missing"