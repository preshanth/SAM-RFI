name: CI

on:
  push:
    branches:
      - sam2_refactor
      - main
  pull_request:
    branches:
      - sam2_refactor
      - main

jobs:
  test:
    name: Test Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas>=2.2.0 numpy>=1.26.0 --only-binary :all:
          pip install -e .[dev]

      - name: Run unit tests
        run: |
          pytest tests/unit -v

      - name: Run integration tests
        run: |
          pytest tests/integration -v

  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install black==24.1.1 ruff==0.1.15 isort==5.13.2

      - name: Check formatting with Black
        run: |
          black --check --line-length=100 src/ tests/

      - name: Check import sorting with isort
        run: |
          isort --check-only --profile black --line-length=100 src/ tests/

      - name: Auto-fix with Ruff
        run: |
          ruff check --fix src/ tests/

      - name: Report remaining Ruff issues (warning only)
        continue-on-error: true
        run: |
          ruff check src/ tests/
